<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tetris Cannon</title>
<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
}
body {
  background-color: #111827;
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 6px;
}
.top-bar {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  font-size: 12px;
  font-weight: bold;
}
.stat-pill {
  background-color: #1f2937;
  color: #fde047;
  border: 2px solid #f59e0b;
  border-radius: 8px;
  padding: 5px 8px;
  white-space: nowrap;
}
.stat-pill.blue {
  color: #38bdf8;
  border-color: #0ea5e9;
}
.snd-btn {
  background-color: #1f2937;
  color: #f8fafc;
  border: 2px solid #94a3b8;
  border-radius: 8px;
  padding: 5px 7px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}
.status-pill {
  flex: 1;
  text-align: center;
  background-color: #1f2937;
  color: #4ade80;
  border: 2px solid #22c55e;
  border-radius: 8px;
  padding: 5px 6px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status-pill.cannon-on {
  background-color: #dc2626;
  color: #ffffff;
  border-color: #fde047;
}
#board-frame {
  position: relative;
  width: 300px;
  height: 540px;
  max-height: calc(100vh - 122px);
  max-width: calc((100vh - 122px) * 0.5555);
  border: 4px solid #38bdf8;
  border-radius: 10px;
  background-color: #090d16;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(14, 165, 233, 0.35);
}
#board-frame.cannon-on {
  border-color: #facc15;
  box-shadow: 0 0 22px rgba(250, 204, 21, 0.7);
}
#cv {
  display: block;
  width: 100%;
  height: 100%;
}
#overlay-box {
  position: absolute;
  top: 72px;
  left: 14px;
  right: 14px;
  background-color: #1e293b;
  border: 3px solid #facc15;
  border-radius: 12px;
  padding: 16px 12px;
  text-align: center;
  z-index: 10;
}
#ov-title {
  font-size: 21px;
  font-weight: bold;
  color: #facc15;
}
#ov-help {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.4;
  color: #e2e8f0;
}
#btn-play {
  margin-top: 12px;
  background-color: #ef4444;
  color: #ffffff;
  border: 2px solid #fde047;
  border-radius: 10px;
  padding: 11px 26px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.pads {
  width: 100%;
  max-width: 420px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
.pad-btn {
  background-color: #1f2937;
  color: #ffffff;
  border: 2px solid #38bdf8;
  border-radius: 10px;
  padding: 13px 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.pad-btn.accent {
  background-color: #d97706;
  border-color: #fde047;
}
</style>
</head>
<body>
  <div class="top-bar">
    <span class="stat-pill" id="pts-txt">0 pts</span>
    <span class="stat-pill blue" id="lvl-txt">Nv 1</span>
    <span class="status-pill" id="st-txt">TOCA PARA DISPARAR</span>
    <button type="button" class="snd-btn" id="btn-snd">Sonido: Si</button>
  </div>

  <div id="board-frame">
    <canvas id="cv" width="300" height="540"></canvas>
    <div id="overlay-box">
      <div id="ov-title">TETRIS CANNON</div>
      <div id="ov-help">
        Cada 400 pts salen canones: <b>toca el cuadro</b> donde quieras disparar.<br />
        Piezas con cuadro <b>dorado</b> barren filas al encajar.
      </div>
      <button type="button" id="btn-play">JUGAR</button>
    </div>
  </div>

  <div class="pads">
    <button type="button" class="pad-btn" id="p-left">Izq</button>
    <button type="button" class="pad-btn accent" id="p-right">Der</button>
    <button type="button" class="pad-btn" id="p-rot">Girar</button>
    <button type="button" class="pad-btn" id="p-down">Bajar</button>
  </div>
