<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tetris Cannon</title>
<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
}
body {
  background-color: #111827;
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 6px;
}
.top-bar {
  width: 100%;
  max-width: 420px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 13px;
  font-weight: bold;
  flex: 0 0 auto;
}
.stat-pill {
  background-color: #1f2937;
  color: #fde047;
  border: 2px solid #f59e0b;
  border-radius: 8px;
  padding: 5px 9px;
  white-space: nowrap;
}
.stat-pill.blue {
  color: #38bdf8;
  border-color: #0ea5e9;
}
.status-pill {
  flex: 1;
  text-align: center;
  background-color: #1f2937;
  color: #4ade80;
  border: 2px solid #22c55e;
  border-radius: 8px;
  padding: 5px 6px;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.status-pill.cannon-on {
  background-color: #dc2626;
  color: #ffffff;
  border-color: #fde047;
}
#board-frame {
  position: relative;
  width: 310px;
  height: 558px;
  max-height: calc(100vh - 122px);
  max-width: calc((100vh - 122px) * 0.5555);
  border: 4px solid #38bdf8;
  border-radius: 10px;
  background-color: #090d16;
  overflow: hidden;
  box-shadow: 0 0 24px rgba(14, 165, 233, 0.35);
  flex: 0 1 auto;
}
#board-frame.cannon-on {
  border-color: #facc15;
  box-shadow: 0 0 24px rgba(250, 204, 21, 0.7);
}
#cv {
  display: block;
  width: 100%;
  height: 100%;
}
#overlay-box {
  position: absolute;
  top: 72px;
  left: 16px;
  right: 16px;
  background-color: #1e293b;
  border: 3px solid #facc15;
  border-radius: 12px;
  padding: 16px 12px;
  text-align: center;
  z-index: 10;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.65);
}
#ov-title {
  font-size: 22px;
  font-weight: bold;
  color: #facc15;
  letter-spacing: 1px;
}
#ov-help {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.4;
  color: #e2e8f0;
}
#btn-play {
  margin-top: 12px;
  background-color: #ef4444;
  color: #ffffff;
  border: 2px solid #fde047;
  border-radius: 10px;
  padding: 11px 26px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.pads {
  width: 100%;
  max-width: 420px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  flex: 0 0 auto;
}
.pad-btn {
  background-color: #1f2937;
  color: #ffffff;
  border: 2px solid #38bdf8;
  border-radius: 10px;
  padding: 13px 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.pad-btn:active {
  background-color: #0284c7;
}
.pad-btn.accent {
  background-color: #d97706;
  border-color: #fde047;
}
</style>
</head>
<body>
  <div class="top-bar">
    <span class="stat-pill" id="pts-txt">0 pts</span>
    <span class="stat-pill blue" id="lvl-txt">Nv 1</span>
    <span class="status-pill" id="st-txt">TOCA EL CUADRO PARA DISPARAR</span>
  </div>

  <div id="board-frame">
    <canvas id="cv" width="300" height="540"></canvas>
    <div id="overlay-box">
      <div id="ov-title">TETRIS CANNON</div>
      <div id="ov-help">
        Cada 400 pts salen canones: <b>toca el cuadro</b> donde quieras disparar.<br />
        Piezas con cuadro <b>dorado</b> barren filas al encajar.
      </div>
      <button type="button" id="btn-play">JUGAR</button>
    </div>
  </div>

  <div class="pads">
    <button type="button" class="pad-btn" id="p-left">Izq</button>
    <button type="button" class="pad-btn" id="p-rot">Girar</button>
    <button type="button" class="pad-btn" id="p-down">Bajar</button>
    <button type="button" class="pad-btn accent" id="p-right">Der</button>
  </div>

  <script>
  (function () {
    var COLS = 10;
    var ROWS = 18;
    var CELL = 30;

    var cv = document.getElementById("cv");
    var ctx = cv.getContext("2d");
    var frame = document.getElementById("board-frame");
    var stTxt = document.getElementById("st-txt");
    var ptsTxt = document.getElementById("pts-txt");
    var lvlTxt = document.getElementById("lvl-txt");
    var ovBox = document.getElementById("overlay-box");
    var ovTitle = document.getElementById("ov-title");
    var ovHelp = document.getElementById("ov-help");
    var btnPlay = document.getElementById("btn-play");

    var CLASSIC_PIECES = [
      { m: [[1, 1, 1, 1]], c: "#00e5ff", hi: "#a5f3fc", lo: "#00838f" },
      { m: [[1, 1], [1, 1]], c: "#ffd600", hi: "#fef08a", lo: "#b28704" },
      { m: [[0, 1, 0], [1, 1, 1]], c: "#d500f9", hi: "#f0abfc", lo: "#8e00a6" },
      { m: [[1, 0, 0], [1, 1, 1]], c: "#2979ff", hi: "#93c5fd", lo: "#004ecb" },
      { m: [[0, 0, 1], [1, 1, 1]], c: "#ff6d00", hi: "#fdba74", lo: "#c43e00" },
      { m: [[0, 1, 1], [1, 1, 0]], c: "#00e676", hi: "#86efac", lo: "#00a152" },
      { m: [[1, 1, 0], [0, 1, 1]], c: "#ff1744", hi: "#fda4af", lo: "#b20024" }
    ];

    var grid = [];
    var active = false;
    var score = 0;
    var level = 1;
    var nextCannonPts = 400;

    var cannonMode = false;
    var cannonTimer = 0;
    var shotsLeft = 0;
    var aimPoint = { x: 150, y: 240, show: false };

    var piece = null;
    var fallTick = 0;
    var shots = [];
    var sparks = [];
    var flashes = [];

    function emptyGrid() {
      var arr = [];
      for (var r = 0; r < ROWS; r++) {
        var row = [];
        for (var c = 0; c < COLS; c++) row.push(null);
        arr.push(row);
      }
      return arr;
    }

    function newPiece() {
      var tpl = CLASSIC_PIECES[Math.floor(Math.random() * CLASSIC_PIECES.length)];
      var mat = [];
      var ones = [];
      for (var r = 0; r < tpl.m.length; r++) {
        var row = [];
        for (var c = 0; c < tpl.m[r].length; c++) {
          row.push(tpl.m[r][c]);
          if (tpl.m[r][c]) ones.push({ r: r, c: c });
        }
        mat.push(row);
      }
      var gold = null;
      if (ones.length > 0 && Math.random() < 0.32) {
        gold = ones[Math.floor(Math.random() * ones.length)];
      }
      return {
        m: mat,
        c: tpl.c,
        hi: tpl.hi,
        lo: tpl.lo,
        gold: gold,
        x: Math.floor((COLS - mat[0].length) / 2),
        y: 0
      };
    }

    function canMove(p, nx, ny, nm) {
      var m = nm || p.m;
      for (var r = 0; r < m.length; r++) {
        for (var c = 0; c < m[r].length; c++) {
          if (!m[r][c]) continue;
          var gx = nx + c;
          var gy = ny + r;
          if (gx < 0 || gx >= COLS || gy >= ROWS) return false;
          if (gy >= 0 && grid[gy][gx]) return false;
        }
      }
      return true;
    }

    function addScore(pts) {
      score += pts;
      level = 1 + Math.floor(score / 350);
      ptsTxt.textContent = score + " pts";
      lvlTxt.textContent = "Nv " + level;
      if (score >= nextCannonPts && !cannonMode) {
        nextCannonPts += 400;
        enableCannons();
      }
    }

    function enableCannons() {
      cannonMode = true;
      cannonTimer = 180;
      shotsLeft = 6;
      aimPoint.show = true;
      frame.classList.add("cannon-on");
      stTxt.classList.add("cannon-on");
      stTxt.textContent = "CANONES: TOCA EL CUADRO (" + shotsLeft + ")";
    }

    function disableCannons() {
      cannonMode = false;
      cannonTimer = 0;
      shotsLeft = 0;
      aimPoint.show = false;
      frame.classList.remove("cannon-on");
      stTxt.classList.remove("cannon-on");
      stTxt.textContent = "TOCA EL CUADRO PARA DISPARAR";
    }

    function makeSparks(x, y, col, n) {
      for (var i = 0; i < n; i++) {
        var ang = Math.random() * Math.PI * 2;
        var spd = 2 + Math.random() * 5;
        sparks.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          col: col,
          life: 16
        });
      }
    }

    function fireCannonsAt(tx, ty) {
      if (!active || !cannonMode || shotsLeft <= 0) return;
      shotsLeft--;
      aimPoint = { x: tx, y: ty, show: shotsLeft > 0 };
      stTxt.textContent = shotsLeft > 0
        ? "CANONES: TOCA EL CUADRO (" + shotsLeft + ")"
        : "DISPARANDO...";

      var leftGun = { x: 20, y: cv.height - 14 };
      var rightGun = { x: cv.width - 20, y: cv.height - 14 };
      var guns = [leftGun, rightGun];
      for (var i = 0; i < guns.length; i++) {
        var dx = tx - guns[i].x;
        var dy = ty - guns[i].y;
        var dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
        var spd = 16;
        shots.push({
          x: guns[i].x,
          y: guns[i].y,
          tx: tx,
          ty: ty,
          vx: (dx / dist) * spd,
          vy: (dy / dist) * spd
        });
      }
      if (shotsLeft <= 0) {
        cannonTimer = Math.min(cannonTimer, 18);
      }
    }

    function detonateAt(px, py) {
      var cc = Math.floor(px / CELL);
      var cr = Math.floor(py / CELL);
      var broken = 0;
      for (var r = cr - 1; r <= cr + 1; r++) {
        for (var c = cc - 1; c <= cc + 1; c++) {
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c]) {
            grid[r][c] = null;
            broken++;
          }
        }
      }
      flashes.push({ x: px, y: py, rad: 36, life: 10 });
      makeSparks(px, py, "#ffea00", 16);
      if (broken > 0) {
        addScore(broken * 20);
      }
    }

    function clearFullLines() {
      var lines = 0;
      for (var r = ROWS - 1; r >= 0; r--) {
        var full = true;
        for (var c = 0; c < COLS; c++) {
          if (!grid[r][c]) {
            full = false;
            break;
          }
        }
        if (full) {
          grid.splice(r, 1);
          var row = [];
          for (var k = 0; k < COLS; k++) row.push(null);
          grid.unshift(row);
          lines++;
          r++;
        }
      }
      if (lines > 0) {
        var ptsTable = [0, 120, 300, 500, 800];
        addScore(ptsTable[lines] || lines * 250);
      }
    }

    function endRound() {
      active = false;
      disableCannons();
      ovTitle.textContent = "JUEGO TERMINADO";
      ovHelp.innerHTML = "Puntaje final: <b>" + score + " pts</b>";
      btnPlay.textContent = "JUGAR DE NUEVO";
      ovBox.style.display = "block";
    }

    function settlePiece() {
      var goldRows = [];
      for (var r = 0; r < piece.m.length; r++) {
        for (var c = 0; c < piece.m[r].length; c++) {
          if (!piece.m[r][c]) continue;
          var gy = piece.y + r;
          var gx = piece.x + c;
          if (gy < 0) {
            endRound();
            return;
          }
          var isG = piece.gold && piece.gold.r === r && piece.gold.c === c;
          grid[gy][gx] = isG
            ? { c: "#ffd600", hi: "#ffffff", lo: "#b45309", gold: true }
            : { c: piece.c, hi: piece.hi, lo: piece.lo, gold: false };
          if (isG) goldRows.push(gy);
        }
      }

      if (goldRows.length > 0) {
        var unique = [];
        for (var i = 0; i < goldRows.length; i++) {
          if (unique.indexOf(goldRows[i]) === -1) unique.push(goldRows[i]);
        }
        unique.sort(function (a, b) { return a - b; });
        var zap = unique.slice(0, 2);
        if (zap.length === 1 && zap[0] + 1 < ROWS) {
          zap.push(zap[0] + 1);
        }
        for (var z = 0; z < zap.length; z++) {
          var rz = zap[z];
          grid.splice(rz, 1);
          var empty = [];
          for (var x = 0; x < COLS; x++) empty.push(null);
          grid.unshift(empty);
          makeSparks(cv.width / 2, rz * CELL + CELL / 2, "#ffd600", 14);
        }
        addScore(160);
      }

      clearFullLines();
      piece = newPiece();
      if (!canMove(piece, piece.x, piece.y, piece.m)) {
        endRound();
      }
    }

    function drawClassicTile(c, r, tile) {
      var x = c * CELL;
      var y = r * CELL;

      ctx.fillStyle = tile.c;
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);

      ctx.fillStyle = tile.hi;
      ctx.fillRect(x + 1, y + 1, CELL - 2, 4);
      ctx.fillRect(x + 1, y + 1, 4, CELL - 2);

      ctx.fillStyle = tile.lo;
      ctx.fillRect(x + 1, y + CELL - 5, CELL - 2, 4);
      ctx.fillRect(x + CELL - 5, y + 1, 4, CELL - 2);

      ctx.strokeStyle = "#090d16";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 0.75, y + 0.75, CELL - 1.5, CELL - 1.5);

      if (tile.gold) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ff1744";
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function render() {
      ctx.clearRect(0, 0, cv.width, cv.height);

      ctx.strokeStyle = "rgba(56, 189, 248, 0.14)";
      ctx.lineWidth = 1;
      for (var c = 1; c < COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL, 0);
        ctx.lineTo(c * CELL, cv.height);
        ctx.stroke();
      }
      for (var r = 1; r < ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL);
        ctx.lineTo(cv.width, r * CELL);
        ctx.stroke();
      }

      for (var gr = 0; gr < ROWS; gr++) {
        for (var gc = 0; gc < COLS; gc++) {
          if (grid[gr][gc]) drawClassicTile(gc, gr, grid[gr][gc]);
        }
      }

      if (piece && active && !cannonMode) {
        for (var pr = 0; pr < piece.m.length; pr++) {
          for (var pc = 0; pc < piece.m[pr].length; pc++) {
            if (!piece.m[pr][pc]) continue;
            var isG = piece.gold && piece.gold.r === pr && piece.gold.c === pc;
            var tObj = isG
              ? { c: "#ffd600", hi: "#ffffff", lo: "#b45309", gold: true }
              : { c: piece.c, hi: piece.hi, lo: piece.lo, gold: false };
            drawClassicTile(piece.x + pc, piece.y + pr, tObj);
          }
        }
      }

      if (cannonMode) {
        var guns = [22, cv.width - 22];
        for (var g = 0; g < guns.length; g++) {
          var gx = guns[g];
          var gy = cv.height - 10;
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(gx, gy, 15, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(gx - 5, gy - 22, 10, 14);
        }

        if (aimPoint.show) {
          ctx.strokeStyle = "#ff1744";
          ctx.lineWidth = 2;
          ctx.strokeRect(aimPoint.x - CELL * 1.5, aimPoint.y - CELL * 1.5, CELL * 3, CELL * 3);
        }
      }

      for (var s = 0; s < shots.length; s++) {
        ctx.fillStyle = "#ff1744";
        ctx.beginPath();
        ctx.arc(shots[s].x, shots[s].y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.arc(shots[s].x, shots[s].y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      for (var fl = 0; fl < flashes.length; fl++) {
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(flashes[fl].x, flashes[fl].y, flashes[fl].rad * (flashes[fl].life / 10), 0, Math.PI * 2);
        ctx.stroke();
      }

      for (var sp = 0; sp < sparks.length; sp++) {
        ctx.fillStyle = sparks[sp].col;
        ctx.fillRect(sparks[sp].x - 3, sparks[sp].y - 3, 6, 6);
      }
    }

    function boardCoords(clientX, clientY) {
      var rect = cv.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * cv.width,
        y: ((clientY - rect.top) / rect.height) * cv.height
      };
    }

    cv.addEventListener("pointerdown", function (e) {
      if (!active || !cannonMode) return;
      var pt = boardCoords(e.clientX, e.clientY);
      fireCannonsAt(pt.x, pt.y);
    });

    cv.addEventListener("click", function (e) {
      if (!active || !cannonMode) return;
      var pt = boardCoords(e.clientX, e.clientY);
      fireCannonsAt(pt.x, pt.y);
    });

    btnPlay.addEventListener("click", function () {
      grid = emptyGrid();
      score = 0;
      level = 1;
      nextCannonPts = 400;
      fallTick = 0;
      shots = [];
      sparks = [];
      flashes = [];
      disableCannons();
      ptsTxt.textContent = "0 pts";
      lvlTxt.textContent = "Nv 1";
      piece = newPiece();
      ovBox.style.display = "none";
      active = true;
      render();
    });

    document.getElementById("p-left").addEventListener("click", function () {
      if (active && !cannonMode && canMove(piece, piece.x - 1, piece.y, piece.m)) {
        piece.x--;
        render();
      }
    });

    document.getElementById("p-right").addEventListener("click", function () {
      if (active && !cannonMode && canMove(piece, piece.x + 1, piece.y, piece.m)) {
        piece.x++;
        render();
      }
    });

    document.getElementById("p-rot").addEventListener("click", function () {
      if (!active || cannonMode || !piece) return;
      var R = piece.m.length;
      var C = piece.m[0].length;
      var rot = [];
      for (var c = 0; c < C; c++) {
        var row = [];
        for (var r = R - 1; r >= 0; r--) row.push(piece.m[r][c]);
        rot.push(row);
      }
      var nextGold = piece.gold ? { r: piece.gold.c, c: R - 1 - piece.gold.r } : null;
      var kicks = [0, -1, 1, -2, 2];
      for (var i = 0; i < kicks.length; i++) {
        if (canMove(piece, piece.x + kicks[i], piece.y, rot)) {
          piece.m = rot;
          piece.gold = nextGold;
          piece.x += kicks[i];
          render();
          return;
        }
      }
    });

    document.getElementById("p-down").addEventListener("click", function () {
      if (active && !cannonMode && canMove(piece, piece.x, piece.y + 1, piece.m)) {
        piece.y++;
        addScore(3);
        render();
      }
    });

    grid = emptyGrid();
    render();

    setInterval(function () {
      var nextShots = [];
      for (var i = 0; i < shots.length; i++) {
        var s = shots[i];
        s.x += s.vx;
        s.y += s.vy;
        var dx = s.tx - s.x;
        var dy = s.ty - s.y;
        if (dx * dx + dy * dy < 320 || s.y <= s.ty) {
          detonateAt(s.tx, s.ty);
        } else {
          nextShots.push(s);
        }
      }
      shots = nextShots;

      var nextFlashes = [];
      for (var f = 0; f < flashes.length; f++) {
        flashes[f].life--;
        if (flashes[f].life > 0) nextFlashes.push(flashes[f]);
      }
      flashes = nextFlashes;

      var nextSparks = [];
      for (var k = 0; k < sparks.length; k++) {
        sparks[k].x += sparks[k].vx;
        sparks[k].y += sparks[k].vy;
        sparks[k].life--;
        if (sparks[k].life > 0) nextSparks.push(sparks[k]);
      }
      sparks = nextSparks;

      if (active) {
        if (cannonMode) {
          cannonTimer--;
          if (cannonTimer <= 0 && shots.length === 0) {
            disableCannons();
          }
        } else {
          fallTick++;
          var speed = Math.max(4, 15 - level);
          if (fallTick >= speed) {
            fallTick = 0;
            if (canMove(piece, piece.x, piece.y + 1, piece.m)) {
              piece.y++;
            } else {
              settlePiece();
            }
          }
        }
      }
      render();
    }, 50);
  })();
  </script>
</body>
</html>
