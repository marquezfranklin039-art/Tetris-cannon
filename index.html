<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tetris Cannon</title>
<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  touch-action: manipulation;
}
body {
  padding: 6px;
  background: linear-gradient(160deg, #dbeafe 0%, #f1f5f9 55%, #e2e8f0 100%);
  color: #0f172a;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
body.dark {
  background: linear-gradient(160deg, #090d16 0%, #111827 60%, #0b1120 100%);
  color: #f8fafc;
}
.bar {
  width: 100%;
  max-width: 360px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 800;
  flex: 0 0 auto;
}
.pill {
  background: #ffffff;
  color: #0369a1;
  border: 2px solid #0284c7;
  border-radius: 999px;
  padding: 4px 9px;
  white-space: nowrap;
}
body.dark .pill {
  background: #172033;
  color: #38bdf8;
  border-color: #38bdf8;
}
.next-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #ffffff;
  border: 2px solid #0284c7;
  border-radius: 999px;
  padding: 2px 7px;
  flex: 0 0 auto;
}
body.dark .next-wrap {
  background: #172033;
  border-color: #38bdf8;
}
#box {
  position: relative;
  width: min(260px, calc((100dvh - 138px) * 0.555));
  aspect-ratio: 10 / 18;
  flex: 0 1 auto;
  border-radius: 16px;
  overflow: hidden;
  border: 3px solid #0284c7;
  background: #f0f9ff;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
}
body.dark #box {
  background: #0b1120;
  border-color: #38bdf8;
}
#box.cannon-active {
  border-color: #f59e0b;
  box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#banner {
  display: none;
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  padding: 6px 8px;
  border-radius: 10px;
  background: rgba(245, 158, 11, 0.95);
  color: #0f172a;
  font-size: 11.5px;
  font-weight: 900;
  text-align: center;
  z-index: 4;
  pointer-events: none;
}
#overlay {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 28px;
  padding: 14px 10px;
  border-radius: 14px;
  text-align: center;
  background: rgba(255, 255, 255, 0.94);
  border: 2px solid #0284c7;
  z-index: 8;
  cursor: pointer;
}
body.dark #overlay {
  background: rgba(15, 23, 42, 0.94);
  border-color: #38bdf8;
}
#ov-title {
  font-size: 18px;
  font-weight: 900;
  color: #0369a1;
}
body.dark #ov-title { color: #38bdf8; }
#ov-sub {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 800;
}
